<style>
:root{--bg:#faf9f7;--bg-nav:rgba(250,249,247,.92);--surface:#fff;--surface-2:#f0ece7;--text:#191918;--muted:#6b6b6b;--faint:#999;--border:#e8e4df;--border-light:#eae6e1;--accent:#c96442;--accent-hover:#a84e32;--shadow:0 1px 2px rgba(25,25,24,.04),0 6px 20px rgba(25,25,24,.05);
  --font:-apple-system,system-ui,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151412;--bg-nav:rgba(21,20,18,.92);--surface:#1d1b18;--surface-2:#262320;--text:#ebe7e0;--muted:#a39d94;--faint:#7d776f;--border:#2e2a25;--border-light:#292520;--accent:#e08a66;--accent-hover:#f0a385;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#151412;--bg-nav:rgba(21,20,18,.92);--surface:#1d1b18;--surface-2:#262320;--text:#ebe7e0;--muted:#a39d94;--faint:#7d776f;--border:#2e2a25;--border-light:#292520;--accent:#e08a66;--accent-hover:#f0a385;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.75}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--accent-hover);text-decoration:underline}
.nav{position:sticky;top:0;z-index:60;height:56px;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:0 1.5rem;background:var(--bg-nav);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border-light)}
.nav .brand{font-weight:700;font-size:1.05rem;letter-spacing:-.01em;color:var(--text)}.nav .brand:hover{text-decoration:none;color:var(--accent-hover)}
.nav .links{display:flex;gap:1.6rem;font-size:.9rem}.nav .links a{color:var(--muted)}.nav .links a:hover,.nav .links a.current{color:var(--text);text-decoration:none}
.nav .tools{display:flex;align-items:center;gap:.6rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.42rem .7rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:.84rem;cursor:pointer;font-family:inherit;line-height:1.2}
.btn:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
.lang{display:inline-flex;align-items:center;gap:.2rem;font-size:.84rem;color:var(--faint)}
.lang button{background:none;border:0;padding:.35rem .5rem;border-radius:6px;color:var(--muted);cursor:pointer;font:inherit;font-size:.84rem}
.lang button:hover{color:var(--text);background:var(--surface-2)}
.lang button[aria-pressed="true"]{color:var(--text);background:var(--surface-2);font-weight:600}
.hero{text-align:center;padding:5rem 1rem 3rem;max-width:52rem;margin:0 auto}
.hero .eyebrow{font-family:var(--mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 1.2rem}
.hero h1{font-size:2.9rem;line-height:1.2;letter-spacing:-.02em;margin:0 0 1rem;font-weight:800}
.hero h1 a{color:var(--text)}.hero h1 a:hover{color:var(--accent-hover);text-decoration:none}
.hero .tagline{font-size:1rem;color:var(--faint);margin:0 0 1.2rem}
.hero .desc{color:var(--muted);font-size:1.05rem;line-height:1.8;margin:0 auto;max-width:44rem}
.hero-links{display:flex;justify-content:center;flex-wrap:wrap;gap:.8rem 1.4rem;align-items:center;margin-top:1.8rem;font-weight:500}
.hero-links .primary{display:inline-flex;align-items:center;padding:.62rem 1.3rem;border-radius:999px;background:var(--text);color:var(--bg)}
.hero-links .primary:hover{background:var(--accent);color:#fff;text-decoration:none}
.film figure{margin:0 auto;max-width:60rem}
.film video{display:block;width:100%;aspect-ratio:16/9;border-radius:12px;background:#000;box-shadow:var(--shadow)}
.film figcaption{margin-top:.7rem;text-align:center;font-size:.84rem;color:var(--faint)}
.section{max-width:72rem;margin:0 auto;padding:1rem 1.5rem 4rem}
.section-title{text-align:center;font-size:1.5rem;font-weight:700;margin:0 0 2rem;letter-spacing:-.01em}
.cards{display:grid;grid-template-columns:1fr;gap:1.4rem;max-width:46rem;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.6rem 1.6rem 1.3rem;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(25,25,24,.05),0 14px 34px rgba(25,25,24,.08)}
.card-label{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:.9rem}
.card h3{font-size:1.25rem;line-height:1.4;margin:0 0 .6rem;font-weight:700}
.card h3 a{color:var(--text)}
.card .sub{color:var(--faint);font-size:.82rem;margin:0 0 .8rem}
.card .desc{color:var(--muted);font-size:.93rem;margin:0 0 1rem}
.card ul{list-style:none;margin:0 0 1.2rem;padding:0;font-size:.86rem;color:var(--muted);line-height:1.6}
.card li{padding-left:1.1em;text-indent:-1.1em;margin:.3rem 0}
.card li::before{content:"— ";color:var(--faint)}
.card-links{margin-top:auto;padding-top:1rem;border-top:1px solid var(--border-light);display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;font-size:.9rem;font-weight:500}
.log{max-width:44rem;margin:0 auto;font-size:.92rem;color:var(--muted)}
.log li{margin:.35rem 0}
.site-footer{border-top:1px solid var(--border-light);padding:1.6rem 1.5rem;text-align:center;font-size:.82rem;color:var(--faint)}
.site-footer a{color:var(--muted)}
/* language switching: only the selected edition is shown */
[data-lang="zh"] [data-lang="en"],[data-lang="en"] [data-lang="zh"]{display:none!important}
@media (max-width:640px){.nav .links{display:none}.hero{padding:3.5rem 1rem 2rem}.hero h1{font-size:1.9rem}.section{padding:0 16px 3rem}.card{padding:1.3rem 1.2rem 1.1rem}}
</style>
</head>
<body>

<script>
(function(){
  var r=document.documentElement;
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  var t=get('wp-theme');if(t==='dark'||t==='light')r.setAttribute('data-theme',t);
  function cur(){var t=r.getAttribute('data-theme');if(t==='dark'||t==='light')return t;return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
  document.querySelectorAll('[data-theme-toggle]').forEach(function(b){b.addEventListener('click',function(){var n=cur()==='dark'?'light':'dark';r.setAttribute('data-theme',n);set('wp-theme',n)})});
  function applyLang(l){r.setAttribute('data-lang',l);r.setAttribute('lang',l==='zh'?'zh-CN':'en');document.querySelectorAll('[data-set-lang]').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-set-lang')===l))})}
  var stored=get('wp-lang');
  var q=new URLSearchParams(location.search).get('lang');
  var initial=(q==='en'||q==='zh')?q:(stored==='en'||stored==='zh')?stored:((navigator.language||'').toLowerCase().indexOf('zh')===0?'zh':'en');
  applyLang(initial);
  document.querySelectorAll('[data-set-lang]').forEach(function(b){b.addEventListener('click',function(){var l=b.getAttribute('data-set-lang');applyLang(l);set('wp-lang',l)})});
})();
</script>
